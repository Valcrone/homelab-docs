<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Homelab architecture overview</title>
<desc>Home network connects through pfSense into an isolated VLAN 10 containing two physical nodes: Node 1 running Zabbix and Wazuh, and Node 2 running osTicket. Zabbix connects out to an AWS pipeline of SNS, Lambda, and S3.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="480" fill="#ffffff"/>

<rect x="20" y="30" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="95" y="52" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Home network</text>

<line x1="170" y1="52" x2="228" y2="52" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="228" y="30" width="150" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="303" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">pfSense</text>
<text x="303" y="61" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Firewall / router</text>

<line x1="303" y1="74" x2="303" y2="110" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="20" y="110" width="640" height="240" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="40" y="132" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#04342C">VLAN 10, isolated network</text>

<rect x="50" y="150" width="270" height="180" rx="12" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="172" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle">Node 1, Dell</text>
<text x="185" y="188" font-family="Arial, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">Proxmox hypervisor</text>

<rect x="70" y="210" width="110" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="125" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">Zabbix</text>

<rect x="190" y="210" width="110" height="44" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="245" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">Wazuh</text>

<text x="185" y="280" font-family="Arial, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">Both monitor Node 1 and Node 2</text>

<rect x="360" y="150" width="270" height="180" rx="12" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="495" y="172" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle">Node 2, HP</text>
<text x="495" y="188" font-family="Arial, sans-serif" font-size="12" fill="#185FA5" text-anchor="middle">Bare metal Ubuntu</text>

<rect x="440" y="210" width="110" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="495" y="232" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">osTicket</text>

<line x1="125" y1="254" x2="125" y2="350" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="368" font-family="Arial, sans-serif" font-size="12" fill="#2C2C2A" text-anchor="middle">Alert published to SNS</text>

<rect x="60" y="380" width="560" height="70" rx="16" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="90" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#412402">AWS event pipeline</text>

<rect x="90" y="410" width="120" height="32" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="150" y="426" font-family="Arial, sans-serif" font-size="12" fill="#412402" text-anchor="middle" dominant-baseline="central">SNS topic</text>

<line x1="210" y1="426" x2="248" y2="426" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="410" width="120" height="32" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="310" y="426" font-family="Arial, sans-serif" font-size="12" fill="#412402" text-anchor="middle" dominant-baseline="central">Lambda</text>

<line x1="370" y1="426" x2="408" y2="426" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="410" y="410" width="120" height="32" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="470" y="426" font-family="Arial, sans-serif" font-size="12" fill="#412402" text-anchor="middle" dominant-baseline="central">S3 bucket</text>
</svg>
